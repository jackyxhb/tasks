name: Nightly Harness Audit

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Baseline harness audit
        run: scripts/audit_harness.sh .

      - name: Entropy check
        run: scripts/harness/entropy_check.sh